name: Watch README for new jobs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: dev

      - name: Add upstream and fetch
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/vanshb03/Summer2026-Internships.git
          git fetch upstream

      - name: Detect new job entries
        id: find_jobs
        run: |
          git diff upstream/dev -- README.md > diff.patch || true
          # only grab added rows at the top of the table that have an <a> link
          grep '^+| ' diff.patch | grep '<a href=' | sed 's/^+//' > added.txt

          if [ ! -s added.txt ]; then
            echo "no_new=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "no_new=false" >> $GITHUB_OUTPUT

          subjects=''
          bodies=''
          while IFS='|' read -r _ company role _ link_html _; do
            company=$(echo "$company" | xargs)
            role=$(echo "$role" | xargs)
            url=$(echo "$link_html" | grep -oP 'href="\K[^"]+' || echo '')
            if [ -n "$subjects" ]; then
              subjects="$subjects, $company - $role"
              bodies="$bodies"$'\n'"$company - $role: $url"
            else
              subjects="$company - $role"
              bodies="$company - $role: $url"
            fi
          done < added.txt

          echo "email_subject=$subjects" >> $GITHUB_OUTPUT
          echo "email_body=$bodies" >> $GITHUB_OUTPUT

      - name: Send email
        if: steps.find_jobs.outputs.no_new == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from:     ${{ secrets.SMTP_USERNAME }}
          to:       ${{ secrets.NOTIFY_EMAIL }}
          subject:  ${{ steps.find_jobs.outputs.email_subject }}
          body:     |
            ${{ steps.find_jobs.outputs.email_body }}

      - name: Merge upstream into dev
        if: steps.find_jobs.outputs.no_new == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout dev
          git merge upstream/dev --no-edit
          git push origin dev
